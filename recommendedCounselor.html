        <h1>Your recommended counselor is:</h1><br>
        <div class="card p-3" style="width: 25rem;">
            <div class="card-body">
                <h5 class="card-title text-center" id="name"></h5>

                <p class="text-center">
                    <a class="card-link" id="emailLink"></a>
                </p>

                <p class="card-text text-center" id="phone"></p>
            </div>
        </div>

        <script>
            const counselorName = localStorage.getItem("counselorName");
            const counselorEmail = localStorage.getItem("counselorEmail");
            const counselorPhone = localStorage.getItem("counselorPhone");

            document.getElementById("name").innerHTML = counselorName;

            document.getElementById("emailLink").innerHTML = counselorEmail;
            document.getElementById("emailLink").href = "mailto:" + counselorEmail;

            document.getElementById("phone").innerHTML = counselorPhone;
        </script>
