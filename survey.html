<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <!-- Bootstrap Icons CSS -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">

        <!-- Bootstrap JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container-fluid ps-3">
            <h1 class="text-center">Which counselor do you need?</h1><br>
            <p class="text-center">Take this quiz to find out</p><hr>
            <form id="surveyForm" action="/meetCounselor" method="post">
                
                <!--Ask for name and grade-->
                <p><strong>First name</strong></p>
                <input type="text" id="firstname" name="firstname" class="form-control"><br>
                <p><strong>Last name</strong></p>
                <input type="text" id="lastname" name="lastname" class="form-control"><br>
                <p><strong>Grade</strong></p>
                <input type="radio" id="grade1" name="grade">
                <label for="grade1">9th Grade</label><br>
                <input type="radio" id="grade2" name="grade">
                <label for="grade2">10th Grade</label><br>
                <input type="radio" id="grade3" name="grade">
                <label for="grade3">11th Grade</label><br>
                <input type="radio" id="grade4" name="grade">
                <label for="grade4">12th Grade</label><br><hr>

                <!--Base question -->
                <p><strong>What are you seeking counseling for?</strong></p><br>
                <input type="radio" id="baseQuestion1" name="baseQuestion" value="1">
                <label for="baseQuestion1">A personal problem</label><br>
                <input type="radio" id="baseQuestion2" name="baseQuestion" value="2">
                <label for="baseQuestion2">General counseling</label><br>
                <input type="radio" id="baseQuestion3" name="baseQuestion" value="3">
                <label for="baseQuestion3">Graduation preparation</label><br><hr>

                <!--Submit Button-->
                <input type="submit" value="Submit" class="btn btn-primary">
            </form>
        </div>
        
        <script>
            let totalValue = 0;

            if(totalValue == 1) {
                // Redirect to counselor 1
                window.location.href = "/Path1Survey";
            }
             else if(totalValue == 2) {
                // Redirect to counselor 2
                window.location.href = "/Path2Survey";
            }
             else if(totalValue == 3) {
                // Redirect to counselor 3
                window.location.href = "/Path3Survey";
            }
        </script>
    </body>
</html>
